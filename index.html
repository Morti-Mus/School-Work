<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Page Title</title>
    <link rel="stylesheet" href="js-test-uppgift.css">
    <style>
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgb(0, 0, 0);
            background-color: rgba(0, 0, 0, 0.4);
            padding-top: 60px;
        }

        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <form>
        <input type="text" id="inputValue" placeholder="Enter value"/>
        <button type="button" onclick="AddValue()">Add to Array</button><br>

        <ul id="arrayList"></ul>

        <button type="button" onclick="Geeks()">Submit</button>
    </form>
    <br>
    <p id="par"></p>

    <!-- Modal for Update -->
<div id="updateModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="CloseUpdateModal()">&times;</span>
        <label for="updatedValue">Enter updated value:</label>
        <input type="text" id="updatedValue">
        <button onclick="UpdateValue()">Update</button>
    </div>
</div>

    <script src="js-test-uppgift.js"></script>
</body>
</html>
